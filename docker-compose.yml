services:
  nominatim:
    image: mediagis/nominatim:5.1
    container_name: enroute-nominatim
    ports:
      - "8080:8080"
    environment:
      PBF_PATH: /nominatim/data/maryland-latest.osm.pbf
      THREADS: 4
    volumes:
      - ./map-data:/nominatim/data
      - nominatim-data:/var/lib/postgresql/16/main
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: enroute-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./map-data:/osm:ro
      - ./docker/valhalla/config:/config
      - ./docker/valhalla/data:/data
    command: ["valhalla_service", "/config/valhalla.json", "1"]
    restart: unless-stopped 

volumes:
  nominatim-data: