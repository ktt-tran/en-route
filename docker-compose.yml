services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enroute-backend
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      NOMINATIM_URL: ${NOMINATIM_URL}
      VALHALLA_URL: ${VALHALLA_URL}
    depends_on:
      - nominatim
      - valhalla
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:5.1
    container_name: enroute-nominatim
    ports:
      - "${NOMINATIM_PORT}:8080"
    environment:
      PBF_PATH: /nominatim/data/maryland-latest.osm.pbf
      THREADS: 4
    volumes:
      - ./map-data:/nominatim/data
      - nominatim-data:/var/lib/postgresql/16/main
    restart: unless-stopped

  valhalla:
    build:
      context: ./docker/valhalla
      dockerfile: Dockerfile
    container_name: enroute-valhalla
    ports:
      - "${VALHALLA_PORT}:8002"
    environment:
      OSM_PBF: ${PBF_FILE}
    volumes:
      - ./map-data:/osm:ro
      - ./docker/valhalla/config:/config
      - ./docker/valhalla/data:/data
    command: ["valhalla_service", "/config/valhalla.json", "1"]
    restart: unless-stopped 

volumes:
  nominatim-data: